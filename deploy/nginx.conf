# OA 办公系统 · Nginx 反向代理示例
# 前端静态文件 + 后端 /api 转发。放到 /etc/nginx/conf.d/oa.conf 或 nginx 安装目录 conf 下。

upstream oa_backend {
    server 127.0.0.1:4040;
    keepalive 32;
}

server {
    listen       80;
    server_name  oa.example.com;

    # 上传：通用附件 50MB、工作日志 20MB，nginx 这一层给到 60MB 留余量
    client_max_body_size 60m;
    client_body_timeout  120s;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_vary on;

    # 前端产物（npm run build 之后的 dist 目录）
    root  /var/www/oa/dist;
    index index.html;

    location / {
        # hash 路由也用这条兜底，刷新不会 404
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass         http://oa_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # 后端限流按 X-Forwarded-For 首段取真实 IP，这里必须透传
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # 导出 Excel 是流式下载，别让 nginx 缓冲
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://oa_backend/api/public/announcements;
        access_log off;
    }
}
